[build]
  publish = "."
  command = ""

[[redirects]]
  from   = "/api/*"
  to     = "https://hiddenpath-backend-production.up.railway.app/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"